<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GridFal 2.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">
  <h1 class="logo">GridFal 2.0</h1>
  <button id="menuBtn">☰</button>
<div id="menuPanel" style="display:none;">

  <button id="templateBtn">Template</button>

  <button onclick="exportExcel()">Export Excel</button>

  <button onclick="exportPDF()">Export PDF</button>

  <button id="zoomBtnIn">Zoom +</button>

  <button id="zoomBtnOut">Zoom -</button>

  <button id="themeToggle">🌙</button>

  <button onclick="resetGrid()">🗑 Reset Grid</button>
</div>
  <div class="actions">
    <div class="group">
      <button id="addRowBtn">
        ＋ Row
      </button>
      <button id="addColumnBtn">
        ＋ Column
      </button>
    </div>

<div class="group">
  <button onclick="deleteRow()">Hapus Row</button>
  <button onclick="deleteColumn()">Hapus Column</button>
  <button onclick="undoAction()">↶ Undo</button>
  
  <button onclick="redoAction()">↷ Redo</button>
  </div>
<div class="search-box">
  <input
    type="text"
    id="searchInput"
    placeholder="Cari..."
  >

  <span class="search-icon"
        onclick="searchCell()">🔍</span>

</div>

    <div id="saveStatus" class="save-status">Belum disimpan</div>
  
</header>

<section class="intro" id="introBox">

  <button class="close-intro" onclick="closeIntro()">
    ✕
  </button>

  <p class="desc">
    Tool untuk membuat Grid/Tabel dengan cepat.
  </p>

  <p class="hint-main">
    Mulai dengan tekan tombol <b>+ Row</b> atau <b>+ Column</b> untuk membuat struktur Grid.
  </p>

</section>

  <h2 id="tableTitle" contenteditable="true" class="table-title">
  Judul Tabel
  </h2>
  
<main class="workspace">
  <div class="table-container">

    <table id="gridTable">
  <tbody>
    <tr>
      <th contenteditable="true">NO</th>
      <th contenteditable="true">ISI</th>
      <th contenteditable="true">ISI</th>
    </tr>

    <tr>
      <td contenteditable="true">1</td>
      <td contenteditable="true">Isi</td>
      <td contenteditable="true">Isi</td>
    </tr>
  </tbody>
    </table> 

    <!-- FIX: empty state di luar table -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <h3>Grid masih kosong</h3>
      <p>Tambahkan row atau column untuk mulai</p>
    </div>

  </div>
</main>
  
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</body>

</div>
</html>
